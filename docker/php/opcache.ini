; OPcache（開発環境向け設定）
;
; PHP ファイルをコンパイル済みのバイトコードとして共有メモリにキャッシュし、
; リクエストごとのファイル読み込み・パースを省略する。
; baserCMS では OPcache の有無で PHP 側の処理時間が約 3 倍変わる。
;
; 拡張の有効化（zend_extension）は baserproject/basercms イメージ側（baser-docker）で行っており、
; ここには書かない。このファイルはイメージ既定の設定を上書きするためのもの。
;
; 開発向けのため、ファイルの更新はリクエストごとに確認して即時反映する（revalidate_freq=0）。
; 本番では revalidate_freq を 60 程度にすると、更新の反映が最長 60 秒遅れる代わりに
; 更新時刻の確認コストを減らせる。validate_timestamps=0 は baserCMS のアップデート機能で
; 書き換えたファイルが反映されなくなるため推奨しない。

opcache.enable=1
opcache.enable_cli=0

; キャッシュに使う共有メモリ（MB）とファイル数の上限。
; baserCMS はテーマ・プラグイン込みで数千ファイルあるため、既定値（128MB / 10000）より多めにしておく。
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; ファイルの更新確認。0 は毎リクエスト確認（開発向け）。
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; CakePHP / baserCMS はアノテーション（docblock）を参照するため、コメントは必ず保持する。
opcache.save_comments=1
