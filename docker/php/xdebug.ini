; Xdebug（開発環境向け設定）
;
; イメージ既定の xdebug.ini は start_with_request=yes で全リクエストに Xdebug が介入し、
; PHP 側の処理時間が 15% 程度増える。開発中の表示速度とテスト実行時間を優先し、
; トリガーがあるときだけ起動する trigger に変更する。
;
; 起動方法:
;   - ブラウザ: Xdebug Helper 等の拡張で XDEBUG_SESSION Cookie を付ける、
;               または URL に ?XDEBUG_TRIGGER=1 を付ける
;   - CLI / phpunit: docker exec -e XDEBUG_TRIGGER=1 bc-php vendor/bin/phpunit ...
;   - PhpStorm の Debug 実行は自動でトリガーが付くため、そのままブレークポイントが効く
;
; 従来どおり常時起動にしたい場合は、docker-compose.yml の XDEBUG_SESSION のコメントを外す
; （環境変数の XDEBUG_SESSION もトリガーとして認識される）。

xdebug.start_with_request=trigger
xdebug.trigger_value=
